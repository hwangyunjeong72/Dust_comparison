<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>오늘의 진짜 정보판</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;color:#222;font-family:Arial,"Malgun Gothic",sans-serif}
.dashboard{width:100vw;height:100vh;min-width:1100px;min-height:620px;padding:25px;display:flex;flex-direction:column}
.header{height:60px;display:flex;align-items:center;justify-content:space-between}
.title{font-size:27px;font-weight:bold}.date{font-size:14px;color:#666}
.main{flex:1;display:flex;gap:18px;min-height:0}
.chart-section,.side-panel{background:#fff;border:1px solid #d5d9df;border-radius:10px}
.chart-section{flex:1;padding:18px;display:flex;flex-direction:column;min-width:0}
.index-tabs,.period-tabs{display:flex;gap:6px;flex-wrap:wrap}
.index-tabs{margin-bottom:12px}.period-tabs{margin-bottom:15px}
button{cursor:pointer;font-family:inherit}
.index-tab,.period-tab{border:1px solid #ccd1d8;background:#f7f8fa;border-radius:5px}
.index-tab{padding:9px 16px;font-size:14px}
.period-tab{padding:6px 11px;font-size:12px}
.index-tab.active{background:#222;color:#fff;border-color:#222}
.period-tab.active{background:#e3e7ec;font-weight:bold}
.chart-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.index-name{font-size:19px;font-weight:bold}.current-price{font-size:19px;font-weight:bold}
.change{margin-left:8px;font-size:13px}.up{color:#d33}.down{color:#2878c8}
.chart-container{position:relative;flex:1;min-height:300px;border-top:1px solid #eee;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.side-panel{width:290px;padding:18px;display:flex;flex-direction:column}
.side-title{font-size:18px;font-weight:bold;margin-bottom:16px}
.hover-box,.compare-result{background:#f5f6f8;border:1px solid #dfe3e8;border-radius:6px;padding:14px}
.hover-box{margin-bottom:18px}.hover-title,.result-label{font-size:12px;color:#777}
.hover-price{font-size:23px;font-weight:bold;margin-top:6px}.hover-date{font-size:12px;color:#777;margin-top:5px}
.compare-box{border-top:1px solid #e3e5e8;padding-top:18px}
.compare-title{font-size:14px;font-weight:bold;margin-bottom:12px}
.date-row{margin-bottom:10px}.date-row label{display:block;font-size:12px;color:#777;margin-bottom:4px}
.date-row input{width:100%;padding:8px;border:1px solid #ccd1d8;border-radius:5px}
.compare-button{width:100%;padding:9px;border:0;border-radius:5px;background:#222;color:#fff}
.compare-button:hover{background:#444}
.compare-result{margin-top:16px}.result-value{font-size:21px;font-weight:bold;margin-top:5px}
.result-percent{font-size:13px;margin-top:4px}
.footer{height:30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#777}
.status{color:#228844}
</style>

</head>

<body>

<div class="dashboard">

<div class="header">
    <div class="title">📊 오늘의 진짜 정보판</div>
    <div class="date">2026-09-14</div>
</div>

<div class="main">

<section class="chart-section">

<div class="index-tabs">
    <button class="index-tab active" onclick="selectIndex('DOW',this)">다우존스</button>
    <button class="index-tab" onclick="selectIndex('SP500',this)">S&P 500</button>
    <button class="index-tab" onclick="selectIndex('NASDAQ',this)">NASDAQ</button>
    <button class="index-tab" onclick="selectIndex('KOSPI',this)">KOSPI</button>
</div>

<div class="period-tabs">
    <button class="period-tab active" onclick="selectPeriod('1분',this)">1분</button>
    <button class="period-tab" onclick="selectPeriod('5분',this)">5분</button>
    <button class="period-tab" onclick="selectPeriod('10분',this)">10분</button>
    <button class="period-tab" onclick="selectPeriod('30분',this)">30분</button>
    <button class="period-tab" onclick="selectPeriod('60분',this)">60분</button>
    <button class="period-tab" onclick="selectPeriod('1일',this)">1일</button>
    <button class="period-tab" onclick="selectPeriod('1주일',this)">1주일</button>
    <button class="period-tab" onclick="selectPeriod('1달',this)">1달</button>
    <button class="period-tab" onclick="selectPeriod('1년',this)">1년</button>
    <button class="period-tab" onclick="selectPeriod('전체',this)">전체</button>
</div>

<div class="chart-info">
    <div>
        <span class="index-name" id="indexName">다우존스</span>
        <span class="change up" id="change">▲ 0.82%</span>
    </div>
    <div class="current-price" id="currentPrice">45,123.45</div>
</div>

<div class="chart-container">
    <canvas id="stockChart"></canvas>
</div>

</section>

<aside class="side-panel">

<div class="side-title">📌 지수 정보</div>

<div class="hover-box">
    <div class="hover-title">차트 위치</div>
    <div class="hover-price" id="hoverPrice">-</div>
    <div class="hover-date" id="hoverDate">차트에 마우스를 올려보세요</div>
</div>

<div class="compare-box">
    <div class="compare-title">📅 두 날짜 비교</div>

```
<div class="date-row">
    <label>첫 번째 날짜</label>
    <input type="date" id="date1" value="2026-09-12">
</div>

<div class="date-row">
    <label>두 번째 날짜</label>
    <input type="date" id="date2" value="2026-09-14">
</div>

<button class="compare-button" onclick="compareDates()">두 날짜 비교</button>

<div class="compare-result">
    <div class="result-label">변화량</div>
    <div class="result-value" id="compareValue">+125.40</div>
    <div class="result-percent up" id="comparePercent">▲ +0.28%</div>
</div>
```

</div>

</aside>

</div>

<div class="footer">
    <div>현재 선택: <strong id="footerIndex">다우존스</strong> / <strong id="footerPeriod">1분</strong></div>
    <div class="status">● 데이터 상태: 정상</div>
</div>

</div>

<script>

let selectedIndex="DOW",selectedPeriod="1분";
const canvas=document.getElementById("stockChart"),ctx=canvas.getContext("2d");

const indexData={
    DOW:{name:"다우존스",base:45000},
    SP500:{name:"S&P 500",base:6500},
    NASDAQ:{name:"NASDAQ",base:22000},
    KOSPI:{name:"KOSPI",base:3300}
};

function drawChart(){

    const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;
    canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);

    const base=indexData[selectedIndex].base;
    const values=Array.from({length:60},(_,i)=>
        base+Math.sin(i/5)*base*.005+(Math.random()-.5)*base*.003
    );

    const max=Math.max(...values),min=Math.min(...values);
    const L=65,R=20,T=20,B=40;
    const cw=w-L-R,ch=h-T-B;

    /* 배경 눈금 */
    ctx.strokeStyle="#e5e7eb";
    ctx.fillStyle="#777";
    ctx.lineWidth=1;
    ctx.font="11px Arial";

    /* 가로 눈금 = 주가 */
    for(let i=0;i<5;i++){

        const y=T+ch*i/4;
        const price=max-(max-min)*i/4;

        ctx.beginPath();
        ctx.moveTo(L,y);
        ctx.lineTo(w-R,y);
        ctx.stroke();

        ctx.textAlign="right";
        ctx.fillText(
            price.toLocaleString("ko-KR",{maximumFractionDigits:2}),
            L-8,y+4
        );
    }

    /* 세로 눈금 = 날짜/시간 */
    const dates=["09:00","10:00","11:00","12:00","13:00","14:00","15:00"];

    dates.forEach((date,i)=>{

        const x=L+cw*i/(dates.length-1);

        ctx.beginPath();
        ctx.moveTo(x,T);
        ctx.lineTo(x,h-B);
        ctx.stroke();

        ctx.textAlign="center";
        ctx.fillText(date,x,h-15);
    });

    /* 차트 선 */
    ctx.beginPath();

    values.forEach((v,i)=>{

        const x=L+cw*i/(values.length-1);
        const y=T+(max-v)/(max-min)*ch;

        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });

    ctx.strokeStyle="#333";
    ctx.lineWidth=2;
    ctx.stroke();

    const last=values.at(-1);

    document.getElementById("currentPrice").textContent=
        last.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});

    canvas.chartValues=values;
    canvas.chartArea={L,R,T,B,cw,ch};
}

function selectIndex(index,button){

    selectedIndex=index;
    document.querySelectorAll(".index-tab").forEach(x=>x.classList.remove("active"));
    button.classList.add("active");

    document.getElementById("indexName").textContent=indexData[index].name;
    document.getElementById("footerIndex").textContent=indexData[index].name;

    drawChart();
}

function selectPeriod(period,button){

    selectedPeriod=period;
    document.querySelectorAll(".period-tab").forEach(x=>x.classList.remove("active"));
    button.classList.add("active");
    document.getElementById("footerPeriod").textContent=period;

    drawChart();
}

canvas.addEventListener("mousemove",e=>{

    if(!canvas.chartValues)return;

    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left;
    const {L,R,cw}=canvas.chartArea;

    let i=Math.round((x-L)/cw*(canvas.chartValues.length-1));
    i=Math.max(0,Math.min(canvas.chartValues.length-1,i));

    const value=canvas.chartValues[i];

    document.getElementById("hoverPrice").textContent=
        value.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});

    document.getElementById("hoverDate").textContent=
        "09:00 ~ 15:00 / 구간 "+(i+1);

});

canvas.addEventListener("mouseleave",()=>{
    document.getElementById("hoverPrice").textContent="-";
    document.getElementById("hoverDate").textContent="차트에 마우스를 올려보세요";
});

function compareDates(){

    const d1=document.getElementById("date1").value;
    const d2=document.getElementById("date2").value;

    if(!d1||!d2){
        alert("두 날짜를 선택해주세요.");
        return;
    }

    const v1=indexData[selectedIndex].base;
    const v2=v1+125.4;
    const diff=v2-v1;
    const percent=diff/v1*100;

    document.getElementById("compareValue").textContent=
        (diff>=0?"+":"")+diff.toFixed(2);

    const p=document.getElementById("comparePercent");
    p.textContent=(diff>=0?"▲ +":"▼ ")+percent.toFixed(2)+"%";
    p.className="result-percent "+(diff>=0?"up":"down");
}

window.addEventListener("resize",drawChart);
drawChart();

</script>

</body>
</html>
