<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 진짜 정보판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#222;font-family:Arial,"Malgun Gothic",sans-serif}.dashboard{width:100vw;height:100vh;min-width:1100px;min-height:620px;padding:25px;display:flex;flex-direction:column}.header{height:60px;display:flex;align-items:center;justify-content:space-between}.title{font-size:27px;font-weight:bold}.date{font-size:14px;color:#666}.main{flex:1;display:flex;gap:18px;min-height:0}.chart-section,.side-panel{background:#fff;border:1px solid #d5d9df;border-radius:10px}.chart-section{flex:1;padding:18px;display:flex;flex-direction:column;min-width:0}.side-panel{width:290px;padding:18px;display:flex;flex-direction:column}.index-tabs,.period-tabs{display:flex;gap:6px;flex-wrap:wrap}.index-tabs{margin-bottom:12px}.period-tabs{margin-bottom:15px}button{cursor:pointer;font-family:inherit}.index-tab,.period-tab{border:1px solid #ccd1d8;background:#f7f8fa;border-radius:5px}.index-tab{padding:9px 16px;font-size:14px}.period-tab{padding:6px 11px;font-size:12px}.index-tab.active{background:#222;color:#fff;border-color:#222}.period-tab.active{background:#e3e7ec;font-weight:bold}.chart-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.index-name{font-size:19px;font-weight:bold}.current-price{font-size:19px;font-weight:bold}.change{margin-left:8px;font-size:13px}.up{color:#d33}.down{color:#2878c8}.chart-container{position:relative;flex:1;min-height:300px;border-top:1px solid #eee;overflow:hidden}canvas{width:100%;height:100%;display:block}.side-title{font-size:18px;font-weight:bold;margin-bottom:16px}.hover-box,.compare-result{background:#f5f6f8;border:1px solid #dfe3e8;border-radius:6px;padding:14px}.hover-box{margin-bottom:18px}.hover-title,.result-label{font-size:12px;color:#777}.hover-price{font-size:23px;font-weight:bold;margin-top:6px}.hover-date{font-size:12px;color:#777;margin-top:5px}.compare-box{border-top:1px solid #e3e5e8;padding-top:18px}.compare-title{font-size:14px;font-weight:bold;margin-bottom:12px}.date-row{margin-bottom:10px}.date-row label{display:block;font-size:12px;color:#777;margin-bottom:4px}.date-row input{width:100%;padding:8px;border:1px solid #ccd1d8;border-radius:5px}.compare-button{width:100%;padding:9px;border:0;border-radius:5px;background:#222;color:#fff}.compare-button:hover{background:#444}.compare-result{margin-top:16px}.result-value{font-size:21px;font-weight:bold;margin-top:5px}.result-percent{font-size:13px;margin-top:4px}.footer{height:30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#777}.status{color:#228844}.error{color:#c62828}
</style>
</head>
<body>

<div class="dashboard">

<div class="header">
<div class="title">📊 오늘의 진짜 정보판</div>
<div class="date" id="today"></div>
</div>

<div class="main">

<section class="chart-section">

<div class="index-tabs">
<button class="index-tab active" onclick="selectIndex('DOW',this)">다우존스</button>
<button class="index-tab" onclick="selectIndex('SP500',this)">S&P 500</button>
<button class="index-tab" onclick="selectIndex('NASDAQ',this)">NASDAQ</button>
<button class="index-tab" onclick="selectIndex('KOSPI',this)">KOSPI</button>
</div>

<div class="period-tabs">
<button class="period-tab active" onclick="selectPeriod('1분',this)">1분</button>
<button class="period-tab" onclick="selectPeriod('5분',this)">5분</button>
<button class="period-tab" onclick="selectPeriod('10분',this)">10분</button>
<button class="period-tab" onclick="selectPeriod('30분',this)">30분</button>
<button class="period-tab" onclick="selectPeriod('60분',this)">60분</button>
<button class="period-tab" onclick="selectPeriod('1일',this)">1일</button>
<button class="period-tab" onclick="selectPeriod('1주일',this)">1주일</button>
<button class="period-tab" onclick="selectPeriod('1달',this)">1달</button>
<button class="period-tab" onclick="selectPeriod('1년',this)">1년</button>
<button class="period-tab" onclick="selectPeriod('전체',this)">전체</button>
</div>

<div class="chart-info">
<div>
<span class="index-name" id="indexName">다우존스</span>
<span class="change" id="change">-</span>
</div>
<div class="current-price" id="currentPrice">불러오는 중...</div>
</div>

<div class="chart-container">
<canvas id="stockChart"></canvas>
</div>

</section>

<aside class="side-panel">

<div class="side-title">📌 지수 정보</div>

<div class="hover-box">
<div class="hover-title">차트 위치</div>
<div class="hover-price" id="hoverPrice">-</div>
<div class="hover-date" id="hoverDate">차트에 마우스를 올려보세요</div>
</div>

<div class="compare-box">

<div class="compare-title">📅 두 날짜 비교</div>

<div class="date-row">
<label>첫 번째 날짜</label>
<input type="date" id="date1">
</div>

<div class="date-row">
<label>두 번째 날짜</label>
<input type="date" id="date2">
</div>

<button class="compare-button" onclick="compareDates()">두 날짜 비교</button>

<div class="compare-result">
<div class="result-label">변화량</div>
<div class="result-value" id="compareValue">-</div>
<div class="result-percent" id="comparePercent">-</div>
</div>

</div>
</aside>

</div>

<div class="footer">
<div>현재 선택: <strong id="footerIndex">다우존스</strong> / <strong id="footerPeriod">1분</strong></div>
<div class="status" id="status">● 데이터 불러오는 중...</div>
</div>

</div>

<script>
let selectedIndex="DOW",selectedPeriod="1분",chartData=[],hoverIndex=-1;

const canvas=document.getElementById("stockChart"),ctx=canvas.getContext("2d");

const indexes={
DOW:{name:"다우존스",symbol:"^DJI"},
SP500:{name:"S&P 500",symbol:"^GSPC"},
NASDAQ:{name:"NASDAQ",symbol:"^IXIC"},
KOSPI:{name:"KOSPI",symbol:"^KS11"}
};

const periods={
"1분":{range:"1d",interval:"1m"},
"5분":{range:"1d",interval:"5m"},
"10분":{range:"5d",interval:"5m"},
"30분":{range:"1mo",interval:"30m"},
"60분":{range:"1mo",interval:"60m"},
"1일":{range:"1mo",interval:"1d"},
"1주일":{range:"6mo",interval:"1d"},
"1달":{range:"1y",interval:"1d"},
"1년":{range:"1y",interval:"1d"},
"전체":{range:"max",interval:"1mo"}
};

const price=v=>Number(v).toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=t=>new Date(t*1000);
const dateText=t=>dt(t).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});

document.getElementById("today").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"});


/* ==========================
   실제 API 데이터 가져오기
   ========================== */

async function getJSON(url){

/* 1차: Yahoo 직접 요청 */

try{

const r=await fetch(url,{cache:"no-store"});

if(r.ok)return await r.json();

}catch(e){

console.log("직접 요청 실패:",e);

}


/* 2차: CORS 프록시를 통한 요청 */

try{

const proxy=
"https://api.allorigins.win/raw?url="+
encodeURIComponent(url);

const r=await fetch(proxy,{cache:"no-store"});

if(r.ok)return await r.json();

}catch(e){

console.log("프록시 요청 실패:",e);

}

throw new Error("실제 API에 연결할 수 없습니다.");

}


/* ==========================
   데이터 불러오기
   ========================== */

async function loadData(){

const p=periods[selectedPeriod];
const symbol=encodeURIComponent(indexes[selectedIndex].symbol);

const url=
"https://query1.finance.yahoo.com/v8/finance/chart/"+
symbol+
"?range="+p.range+
"&interval="+p.interval+
"&includePrePost=false";

document.getElementById("status").textContent=
"● 실제 데이터 불러오는 중...";

document.getElementById("status").className="status";

document.getElementById("currentPrice").textContent=
"불러오는 중...";

try{

const json=await getJSON(url);
const result=json?.chart?.result?.[0];

if(!result)throw new Error("데이터 없음");

const times=result.timestamp||[];
const values=result.indicators?.quote?.[0]?.close||[];

chartData=times.map((t,i)=>({
time:t,
value:values[i]
})).filter(x=>
x.value!==null&&
Number.isFinite(Number(x.value))
);

if(!chartData.length)
throw new Error("유효한 실제 데이터 없음");

drawChart();
updateCurrent();

document.getElementById("status").textContent=
"● 실제 데이터 연결됨";

}catch(e){

console.error(e);

chartData=[];
hoverIndex=-1;

ctx.clearRect(0,0,canvas.width,canvas.height);

document.getElementById("currentPrice").textContent=
"데이터 없음";

document.getElementById("hoverPrice").textContent="-";

document.getElementById("hoverDate").textContent=
"실제 데이터를 가져오지 못했습니다";

document.getElementById("status").textContent=
"● 실제 데이터 연결 실패";

document.getElementById("status").className=
"status error";

}

}


/* ==========================
   현재 지수값
   ========================== */

function updateCurrent(){

if(!chartData.length)return;

const last=chartData.at(-1);
const previous=chartData.at(-2);

document.getElementById("currentPrice").textContent=
price(last.value);

if(previous){

const diff=last.value-previous.value;
const percent=diff/previous.value*100;
const el=document.getElementById("change");

el.textContent=
(diff>=0?"▲ +":"▼ ")+percent.toFixed(2)+"%";

el.className=
"change "+(diff>=0?"up":"down");

}

}


/* ==========================
   차트
   ========================== */

function drawChart(){

const w=canvas.parentElement.clientWidth;
const h=canvas.parentElement.clientHeight;

canvas.width=w;
canvas.height=h;

ctx.clearRect(0,0,w,h);

if(!chartData.length)return;

const values=chartData.map(x=>Number(x.value));
const max=Math.max(...values);
const min=Math.min(...values);

const L=70,R=20,T=20,B=45;
const cw=w-L-R,ch=h-T-B;


/* 가로 지수 눈금 */

ctx.font="11px Arial";
ctx.lineWidth=1;
ctx.strokeStyle="#e5e7eb";
ctx.fillStyle="#777";

for(let i=0;i<5;i++){

const y=T+ch*i/4;
const v=max-(max-min)*i/4;

ctx.beginPath();
ctx.moveTo(L,y);
ctx.lineTo(w-R,y);
ctx.stroke();

ctx.textAlign="right";
ctx.fillText(price(v),L-8,y+4);

}


/* 24시간 눈금 */

const hours=["00:00","04:00","08:00","12:00","16:00","20:00","24:00"];

hours.forEach((label,i)=>{

const x=L+cw*i/6;

ctx.beginPath();
ctx.moveTo(x,T);
ctx.lineTo(x,h-B);
ctx.stroke();

ctx.textAlign="center";
ctx.fillText(label,x,h-15);

});


/* 실제 데이터가 존재하는 시간만 그리기 */

if(selectedPeriod==="1분"||
selectedPeriod==="5분"||
selectedPeriod==="10분"||
selectedPeriod==="30분"||
selectedPeriod==="60분"){

const first=dt(chartData[0].time);

const start=new Date(
first.getFullYear(),
first.getMonth(),
first.getDate(),
0,0,0
).getTime();

const end=start+86400000;

ctx.beginPath();

let started=false;

chartData.forEach(item=>{

const t=item.time*1000;

if(t<start||t>end)return;

const x=L+(t-start)/(end-start)*cw;

const y=
T+
(max-item.value)/(max-min||1)*ch;

if(!started){

ctx.moveTo(x,y);
started=true;

}else{

ctx.lineTo(x,y);

}

});

ctx.strokeStyle="#222";
ctx.lineWidth=2;

if(started)ctx.stroke();

canvas.chartArea={L,R,T,B,cw,ch,start,end,max,min};

}else{

/* 일/주/월/년 데이터 */

ctx.beginPath();

chartData.forEach((item,i)=>{

const x=
L+cw*i/(chartData.length-1||1);

const y=
T+
(max-item.value)/(max-min||1)*ch;

if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);

});

ctx.strokeStyle="#222";
ctx.lineWidth=2;
ctx.stroke();

canvas.chartArea={
L,R,T,B,cw,ch,
start:chartData[0].time*1000,
end:chartData.at(-1).time*1000,
max,min
};

}


/* 세로 가이드선 */

if(hoverIndex>=0&&chartData[hoverIndex]){

drawGuide(hoverIndex);

}

}


/* ==========================
   세로 가이드선
   ========================== */

function drawGuide(index){

const area=canvas.chartArea;
if(!area)return;

const item=chartData[index];

let x;

if(selectedPeriod==="1분"||
selectedPeriod==="5분"||
selectedPeriod==="10분"||
selectedPeriod==="30분"||
selectedPeriod==="60분"){

x=
area.L+
(item.time*1000-area.start)/
(area.end-area.start)*
area.cw;

}else{

x=
area.L+
index/
(chartData.length-1||1)*
area.cw;

}


/* 세로선 */

ctx.beginPath();

ctx.moveTo(x,area.T);
ctx.lineTo(x,canvas.height-area.B);

ctx.strokeStyle="#888";
ctx.lineWidth=1;
ctx.setLineDash([5,5]);

ctx.stroke();

ctx.setLineDash([]);


/* 실제 값 위치 점 */

const y=
area.T+
(area.max-item.value)/
(area.max-area.min||1)*
area.ch;

ctx.beginPath();
ctx.arc(x,y,4,0,Math.PI*2);

ctx.fillStyle="#222";
ctx.fill();


/* 정보 표시 */

document.getElementById("hoverPrice").textContent=
price(item.value);

document.getElementById("hoverDate").textContent=
dateText(item.time);

}


/* ==========================
   마우스
   ========================== */

canvas.addEventListener("mousemove",e=>{

if(!chartData.length||!canvas.chartArea)return;

const rect=canvas.getBoundingClientRect();
const mouseX=e.clientX-rect.left;

const area=canvas.chartArea;

let target;

if(selectedPeriod==="1분"||
selectedPeriod==="5분"||
selectedPeriod==="10분"||
selectedPeriod==="30분"||
selectedPeriod==="60분"){

const ratio=
Math.max(0,Math.min(1,(mouseX-area.L)/area.cw));

target=
area.start+
ratio*(area.end-area.start);

}else{

const ratio=
Math.max(0,Math.min(1,(mouseX-area.L)/area.cw));

target=
area.start+
ratio*(area.end-area.start);

}


/* 가장 가까운 실제 데이터 찾기 */

let nearest=0;
let distance=Infinity;

chartData.forEach((item,i)=>{

const d=
Math.abs(item.time*1000-target);

if(d<distance){

distance=d;
nearest=i;

}

});

hoverIndex=nearest;

drawChart();

});


canvas.addEventListener("mouseleave",()=>{

hoverIndex=-1;

drawChart();

document.getElementById("hoverPrice").textContent="-";

document.getElementById("hoverDate").textContent=
"차트에 마우스를 올려보세요";

});


/* ==========================
   지수 변경
   ========================== */

function selectIndex(index,button){

selectedIndex=index;

document.querySelectorAll(".index-tab")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

document.getElementById("indexName").textContent=
indexes[index].name;

document.getElementById("footerIndex").textContent=
indexes[index].name;

loadData();

}


/* ==========================
   기간 변경
   ========================== */

function selectPeriod(period,button){

selectedPeriod=period;

document.querySelectorAll(".period-tab")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

document.getElementById("footerPeriod").textContent=
period;

loadData();

}


/* ==========================
   두 날짜 비교
   ========================== */

async function compareDates(){

const d1=document.getElementById("date1").value;
const d2=document.getElementById("date2").value;

if(!d1||!d2){

alert("두 날짜를 선택해주세요.");
return;

}

if(d1===d2){

alert("서로 다른 날짜를 선택해주세요.");
return;

}

try{

const symbol=
encodeURIComponent(indexes[selectedIndex].symbol);

const start=
Math.floor(
new Date(d1+"T00:00:00").getTime()/1000
);

const end=
Math.floor(
new Date(d2+"T23:59:59").getTime()/1000
);

const url=
"https://query1.finance.yahoo.com/v8/finance/chart/"+
symbol+
"?period1="+start+
"&period2="+end+
"&interval=1d"+
"&includePrePost=false";

const json=await getJSON(url);

const result=json?.chart?.result?.[0];

if(!result)throw Error("비교 데이터 없음");

const times=result.timestamp||[];
const values=result.indicators?.quote?.[0]?.close||[];

const data=times.map((t,i)=>({
time:t,
value:values[i]
})).filter(x=>
x.value!==null&&
Number.isFinite(Number(x.value))
);

if(data.length<2){

alert(
"선택한 두 날짜의 실제 데이터를 찾을 수 없습니다."
);

return;

}

const first=data[0].value;
const last=data.at(-1).value;

const diff=last-first;
const percent=diff/first*100;

document.getElementById("compareValue").textContent=
(diff>=0?"+":"")+price(diff);

const p=document.getElementById("comparePercent");

p.textContent=
(diff>=0?"▲ +":"▼ ")+
percent.toFixed(2)+"%";

p.className=
"result-percent "+(diff>=0?"up":"down");

}catch(e){

console.error(e);

document.getElementById("compareValue").textContent=
"비교 실패";

document.getElementById("comparePercent").textContent=
"실제 데이터를 가져오지 못했습니다";

}

}


/* ==========================
   화면 크기 변경
   ========================== */

window.addEventListener("resize",drawChart);

loadData();

</script>

</body>
</html>
