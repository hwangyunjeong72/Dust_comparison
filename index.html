```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대한민국 미세먼지 정보판</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#eef3f7;color:#222}
header{height:75px;background:#183b56;color:#fff;display:flex;align-items:center;justify-content:center}header h1{font-size:27px}
main{max-width:1500px;margin:auto;padding:15px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;min-height:calc(100vh - 105px)}
.left,.right,.box{background:#fff;border:1px solid #d8e0e7;border-radius:9px;padding:15px}.left,.right{padding:16px}.box{margin-bottom:14px}
.controls{display:flex;gap:8px}select,button{padding:9px;border:1px solid #ccc;border-radius:6px;background:#fff}button{background:#183b56;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #ddd;border-radius:7px;padding:12px}.num{font-size:24px;font-weight:bold}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare>div{border:1px solid #ddd;padding:12px;border-radius:7px}
.barbg{height:16px;background:#eee;border-radius:8px}.bar{height:100%;background:#4b82b8;border-radius:8px}
.small{font-size:12px;color:#777}.up{color:#d32f2f}.down{color:#16834b}.good{color:#16834b}.normal{color:#806000}.bad{color:#c62828}.verybad{color:#64208b}.none{color:#777}
.mapbox{height:55%;min-height:390px;background:#f5f8fa;border-radius:8px;overflow:hidden}.map{width:100%;height:100%}
.korea{fill:#dce8ef;stroke:#526b78;stroke-width:2}.marker{cursor:pointer;stroke:#fff;stroke-width:2}.marker:hover{stroke:#222;stroke-width:3}.label{font-size:12px;font-weight:bold;pointer-events:none}
.selected{stroke:#111!important;stroke-width:4!important}.infoTitle{font-size:22px;font-weight:bold}.infoValue{font-size:34px;font-weight:bold}
@media(max-width:900px){.layout{grid-template-columns:1fr}.mapbox{height:450px}}
@media(max-width:600px){.grid,.compare{grid-template-columns:1fr}header h1{font-size:21px}}
</style>
</head>
<body>

<header><h1>🇰🇷 오늘의 진짜 미세먼지 정보판</h1></header>

<main><div class="layout">

<!-- 왼쪽 -->
<section class="left">

<div class="box">
<div class="controls">
<select id="type">
<option value="pm10">미세먼지 PM10</option>
<option value="pm2_5">초미세먼지 PM2.5</option>
</select>
<button onclick="load()">🔄 새로고침</button>
</div>
<div id="status" class="small">⏳ 데이터를 불러오는 중...</div>
<div id="time" class="small"></div>
</div>

<div class="grid">
<div class="card">전국 평균<div id="avg" class="num">-</div><small>㎍/㎥</small></div>
<div class="card">가장 좋은 지역<div id="best" class="num">-</div></div>
<div class="card">가장 나쁜 지역<div id="worst" class="num">-</div></div>
</div>

<div class="box">
<h3>📊 어제 ↔ 오늘</h3>
<div class="compare">
<div><b id="yd">어제</b><div id="yv" class="num">-</div>㎍/㎥</div>
<div><b id="td">오늘</b><div id="tv" class="num">-</div><div id="diff"></div></div>
</div>
</div>

<div class="box">
<h3>📈 지역별 오늘 평균</h3>
<div id="chart">불러오는 중...</div>
</div>

<div class="box">
<h3>🗓 날짜별 기록</h3>
<div id="history" class="small">기록 없음</div>
</div>

</section>


<!-- 오른쪽 -->
<section class="right">

<div class="box">
<h2>🇰🇷 대한민국 미세먼지 지도</h2>

<div class="mapbox">
<svg class="map" viewBox="0 0 600 650">

<path class="korea" d="M255 45L335 65L385 110L420 160L465 205L475 270L450 320L470 370L440 430L390 475L350 535L300 575L250 550L215 505L185 470L155 415L125 365L140 315L125 265L155 220L175 170L190 115L225 75Z"/>

<circle id="m서울" class="marker" cx="245" cy="145" r="13" onclick="selectRegion('서울')"/><text x="257" y="149" class="label">서울</text>
<circle id="m경기" class="marker" cx="270" cy="175" r="13" onclick="selectRegion('경기')"/><text x="283" y="179" class="label">경기</text>
<circle id="m인천" class="marker" cx="215" cy="185" r="13" onclick="selectRegion('인천')"/><text x="188" y="190" class="label">인천</text>
<circle id="m강원" class="marker" cx="350" cy="150" r="13" onclick="selectRegion('강원')"/><text x="363" y="154" class="label">강원</text>
<circle id="m충북" class="marker" cx="330" cy="245" r="13" onclick="selectRegion('충북')"/><text x="343" y="249" class="label">충북</text>
<circle id="m충남" class="marker" cx="240" cy="270" r="13" onclick="selectRegion('충남')"/><text x="205" y="274" class="label">충남</text>
<circle id="m대전" class="marker" cx="295" cy="295" r="13" onclick="selectRegion('대전')"/><text x="308" y="299" class="label">대전</text>
<circle id="m세종" class="marker" cx="270" cy="280" r="11" onclick="selectRegion('세종')"/><text x="230" y="284" class="label">세종</text>
<circle id="m전북" class="marker" cx="260" cy="350" r="13" onclick="selectRegion('전북')"/><text x="272" y="354" class="label">전북</text>
<circle id="m전남" class="marker" cx="215" cy="430" r="13" onclick="selectRegion('전남')"/><text x="180" y="434" class="label">전남</text>
<circle id="m광주" class="marker" cx="245" cy="400" r="13" onclick="selectRegion('광주')"/><text x="257" y="404" class="label">광주</text>
<circle id="m경북" class="marker" cx="375" cy="300" r="13" onclick="selectRegion('경북')"/><text x="388" y="304" class="label">경북</text>
<circle id="m대구" class="marker" cx="365" cy="355" r="13" onclick="selectRegion('대구')"/><text x="378" y="359" class="label">대구</text>
<circle id="m경남" class="marker" cx="330" cy="415" r="13" onclick="selectRegion('경남')"/><text x="343" y="419" class="label">경남</text>
<circle id="m부산" class="marker" cx="405" cy="430" r="13" onclick="selectRegion('부산')"/><text x="418" y="434" class="label">부산</text>
<circle id="m울산" class="marker" cx="405" cy="380" r="13" onclick="selectRegion('울산')"/><text x="418" y="384" class="label">울산</text>
<ellipse id="m제주" class="marker" cx="275" cy="570" rx="35" ry="14" onclick="selectRegion('제주')"/><text x="260" y="575" class="label">제주</text>

</svg>
</div>
</div>

<div class="box">
<h3>📍 다른 지역 선택</h3>
<select id="region" onchange="showSelected()" style="width:100%">
<option value="all">전국</option>
<option>서울</option><option>부산</option><option>대구</option>
<option>인천</option><option>광주</option><option>대전</option>
<option>울산</option><option>세종</option><option>경기</option>
<option>강원</option><option>충북</option><option>충남</option>
<option>전북</option><option>전남</option><option>경북</option>
<option>경남</option><option>제주</option>
</select>
</div>

<div class="box">
<div id="infoTitle" class="infoTitle">전국</div>
<div class="small">현재 미세먼지</div>
<div id="infoValue" class="infoValue">-</div>
<div id="infoGrade">데이터를 불러오는 중...</div>
<div id="infoCompare" class="small">-</div>
</div>

</section>
</div></main>


<script>
const R=[
["서울",37.5665,126.978],["부산",35.1796,129.0756],["대구",35.8714,128.6014],
["인천",37.4563,126.7052],["광주",35.1595,126.8526],["대전",36.3504,127.3845],
["울산",35.5384,129.3114],["세종",36.48,127.289],["경기",37.4138,127.5183],
["강원",37.8228,128.1555],["충북",36.6357,127.4917],["충남",36.5184,126.8],
["전북",35.7175,127.153],["전남",34.8679,126.991],["경북",36.4919,128.8889],
["경남",35.4606,128.2132],["제주",33.4996,126.5312]
];

let DATA=[],selectedMarker=null;

const date=n=>{
let d=new Date();d.setDate(d.getDate()+n);
return d.toISOString().slice(0,10)
};

function grade(v,t){
if(v==null)return["데이터 없음","none"];
if(t=="pm2_5")return v<=15?["좋음","good"]:v<=35?["보통","normal"]:v<=75?["나쁨","bad"]:["매우나쁨","verybad"];
return v<=30?["좋음","good"]:v<=80?["보통","normal"]:v<=150?["나쁨","bad"]:["매우나쁨","verybad"];
}

async function get(x,t){
let u=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${x[1]}&longitude=${x[2]}&hourly=${t}&start_date=${date(-1)}&end_date=${date(0)}&timezone=Asia%2FSeoul`;
let r=await fetch(u);if(!r.ok)throw Error("API 오류");
let d=await r.json(),a=d.hourly[t],tm=d.hourly.time;
let day=n=>{let z=a.filter((v,i)=>tm[i].startsWith(date(n))&&v!=null);return z.length?z.reduce((a,b)=>a+b,0)/z.length:null};
return{name:x[0],cur:[...a].reverse().find(v=>v!=null)??null,y:day(-1),t:day(0),ok:true};
}

async function load(){
status.textContent="⏳ 전국 데이터를 불러오는 중...";
DATA=[];
for(let x of R)try{DATA.push(await get(x,type.value))}
catch(e){DATA.push({name:x[0],cur:null,y:null,t:null,ok:false})}
render();
}

function render(){
let good=DATA.filter(x=>x.cur!=null);
let ar=good.length?good.reduce((a,x)=>a+x.cur,0)/good.length:null;
avg.textContent=ar==null?"-":ar.toFixed(1);

if(good.length){
let s=[...good].sort((a,b)=>a.cur-b.cur);
best.textContent=s[0].name;worst.textContent=s.at(-1).name;
}else best.textContent=worst.textContent="-";

let ys=good.filter(x=>x.y!=null),ts=good.filter(x=>x.t!=null);
let ya=ys.length?ys.reduce((a,x)=>a+x.y,0)/ys.length:null;
let ta=ts.length?ts.reduce((a,x)=>a+x.t,0)/ts.length:null;

yd.textContent="어제 · "+date(-1);td.textContent="오늘 · "+date(0);
yv.textContent=ya==null?"-":ya.toFixed(1);
tv.textContent=ta==null?"-":ta.toFixed(1);

if(ya!=null&&ta!=null){
let d=ta-ya;
diff.className=d>.5?"up":d<-.5?"down":"";
diff.textContent=d>.5?`▲ ${d.toFixed(1)}㎍/㎥ 증가`:d<-.5?`▼ ${Math.abs(d).toFixed(1)}㎍/㎥ 감소`:"━ 어제와 비슷";
}else diff.textContent="비교할 데이터 없음";

let mx=Math.max(...ts.map(x=>x.t),1);
chart.innerHTML=ts.map(x=>`
<div style="display:grid;grid-template-columns:50px 1fr 45px;gap:7px;margin:6px 0;align-items:center">
<span>${x.name}</span><div class="barbg"><div class="bar" style="width:${x.t/mx*100}%"></div></div><b>${x.t.toFixed(1)}</b>
</div>`).join("")||"그래프 데이터 없음";

status.textContent=good.length==17?"✅ 전국 17개 지역 정상":`⚠️ ${good.length}/17개 지역 성공 · 데이터 없음은 임의 표시하지 않음`;
time.textContent="마지막 확인: "+new Date().toLocaleString("ko-KR");

updateMap();showSelected();save();
}

/* 지도 색상 */
function updateMap(){
DATA.forEach(x=>{
let m=document.getElementById("m"+x.name);if(!m)return;
let g=grade(x.cur,type.value);
m.classList.remove("good","normal","bad","verybad","none");
m.classList.add(g[1]);
m.style.fill=x.cur==null?"#aaa":g[1]=="good"?"#36a269":g[1]=="normal"?"#e4b93f":g[1]=="bad"?"#e15b5b":"#8c58a8";
});
}

/* ★ 선택 테두리 오류 수정 핵심 */
function clearSelected(){
document.querySelectorAll(".marker").forEach(m=>m.classList.remove("selected"));
selectedMarker=null;
}

function selectRegion(name){
clearSelected();
region.value=name;
selectedMarker=document.getElementById("m"+name);
if(selectedMarker)selectedMarker.classList.add("selected");
showSelected();
}

function showSelected(){
let name=region.value;

if(name=="all"){
clearSelected();
infoTitle.textContent="전국";
let a=DATA.filter(x=>x.cur!=null);
if(!a.length){infoValue.textContent="-";infoGrade.textContent="데이터 없음";infoCompare.textContent="-";return}
let v=a.reduce((s,x)=>s+x.cur,0)/a.length;
infoValue.textContent=v.toFixed(1);
infoGrade.textContent=grade(v,type.value)[0];
let y=a.filter(x=>x.y!=null);
if(y.length){
let ya=y.reduce((s,x)=>s+x.y,0)/y.length,d=v-ya;
infoCompare.textContent=d>0?`어제보다 ${d.toFixed(1)} 증가`:d<0?`어제보다 ${Math.abs(d).toFixed(1)} 감소`:"어제와 비슷";
}
return;
}

clearSelected();
selectedMarker=document.getElementById("m"+name);
if(selectedMarker)selectedMarker.classList.add("selected");

let x=DATA.find(x=>x.name==name);
infoTitle.textContent=name;

if(!x||x.cur==null){
infoValue.textContent="-";infoGrade.textContent="데이터 없음";infoCompare.textContent="현재 데이터를 가져오지 못했습니다.";return;
}

infoValue.textContent=x.cur.toFixed(1);
infoGrade.textContent=grade(x.cur,type.value)[0];

if(x.y!=null&&x.t!=null){
let d=x.t-x.y;
infoCompare.textContent=d>0?`어제보다 ${d.toFixed(1)} 증가`:d<0?`어제보다 ${Math.abs(d).toFixed(1)} 감소`:"어제와 비슷";
}
}

function save(){
let a=DATA.filter(x=>x.t!=null);if(!a.length)return;
let v=a.reduce((s,x)=>s+x.t,0)/a.length,h=JSON.parse(localStorage.aqHistory||"[]"),today=date(0),t=type.value;
h=h.filter(x=>x.date!=today||x.type!=t);
h.unshift({date:today,type:t,avg:+v.toFixed(1)});
localStorage.aqHistory=JSON.stringify(h.slice(0,30));showHistory();
}

function showHistory(){
let h=JSON.parse(localStorage.aqHistory||"[]");
history.innerHTML=h.length?h.map(x=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${x.date}</b> · ${x.type=="pm10"?"PM10":"PM2.5"} · ${x.avg} ㎍/㎥</div>`).join(""):"기록 없음";
}

type.onchange=load;
region.onchange=showSelected;
load();
</script>
</body>
</html>
